# Publishes the playable build to GitHub Pages on every push to main.
#
# This does NOT replace `npm run gate`. The gate's Playwright playthrough needs
# a browser and ~14 minutes on a software renderer, and CLAUDE.md requires it to
# pass before anything is pushed, so it stays the local pre-push bar. What runs
# here is the cheap half — typecheck, lint, build — so a broken tree can never
# reach the published link.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; skip superseded queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A production build, so `window.__game` is stripped. The test API belongs
      # to dev and gate builds only (CLAUDE.md § Testability).
      - name: Build
        run: npm run build

      # enablement turns Pages on via the API if it is not already enabled,
      # so the first deploy does not need a manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
